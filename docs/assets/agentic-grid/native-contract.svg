<text x="427.0" y="496" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Read-only filter suggestion</text>
<path d="M 322 548 H 112" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="217.0" y="540" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Review the filters</text>
<path d="M 112 592 H 322" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="217.0" y="584" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Explicit Apply</text>
<path d="M 322 678 H 952" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="637.0" y="670" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Native criteria + cursor read</text>
<path d="M 952 722 h38 v13 h-38" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="996" y="714" text-anchor="start" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Current membership, rights and tenant</text>
<path d="M 952 766 H 1162" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1057.0" y="758" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Parameter-bound query and global sort</text>
<path d="M 1162 810 H 952" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="1057.0" y="802" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Bounded permitted rows</text>
<path d="M 952 854 H 322" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="637.0" y="846" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Authorized native response</text>
<text x="34" y="910" font-size="14" fill="#526b83">No model SQL · No tenant override · No mutation · Bounded rows · HTTP and MCP share the native owner</text>
</g></svg>
