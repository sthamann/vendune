<text x="637.0" y="364" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Bounded question + allowlisted schema</text>
<path d="M 742 416 H 532" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="637.0" y="408" text-anchor="middle" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Suggested criteria</text>
<path d="M 532 460 h38 v13 h-38" fill="none" stroke="#1572e8" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="576" y="452" text-anchor="start" font-size="14" fill="#142c44" stroke="#f8fbff" stroke-width="5" paint-order="stroke">Validate criteria; no SQL or identity</text>
